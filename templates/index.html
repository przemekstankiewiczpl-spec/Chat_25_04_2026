<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>CHAT Gemini</title>
    <style>
        /* Styl dla animacji kropek */
        #loader { display: none; margin-bottom: 20px; }
        .dots { display: flex; gap: 8px; }
        .dot { width: 15px; height: 15px; background-color: #4285f4; border-radius: 50%; animation: pulse 1.5s infinite ease-in-out; }
        .dot:nth-child(2) { background-color: #ea4335; animation-delay: 0.2s; }
        .dot:nth-child(3) { background-color: #fbbc05; animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* Style dla historii czatu */
        .chat-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 80%;
            word-wrap: break-word;
            text-align: left;
            line-height: 1.4;
        }

        .user-msg {
            align-self: flex-end;
            background-color: #4285f4;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .model-msg {
            align-self: flex-start;
            background-color: #3c4043;
            color: #e8eaed;
            border-bottom-left-radius: 2px;
            border: 1px solid #5f6368;
        }

        .container-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-bottom: 50px; /* Miejsce na dole, żeby tekst nie dotykał krawędzi */
        }
    </style>
</head>

<body style="margin: 0; font-family: sans-serif; background-color: #1a1a1a; color: white; padding: 20px;">

    <div class="container-wrapper">
        <h1>Czat z Gemini 3 flash</h1>

        <div class="chat-container" id="chat-window">
            {% if history_list %}
                {% for message in history_list %}
                    <div class="message {% if message.role == 'user' %}user-msg{% else %}model-msg{% endif %}">
                        <strong>{% if message.role == 'user' %}Ty:{% else %}Gemini:{% endif %}</strong><br>
                        <span style="white-space: pre-wrap;">{{ message.parts[0].text }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        </div>

        <div id="loader">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <form method="POST" id="chat-form">
            <input type="hidden" name="history" value='{{ history_json }}'>

            <input type="text" name="prompt" id="prompt-input" required placeholder="Zadaj pytanie..."
                   style="padding: 12px; width: 350px; border-radius: 25px; border: 1px solid #555; background: #222; color: white; outline: none;">

            <button type="submit"
                    style="padding: 12px 25px; border-radius: 25px; border: none; background: #4285f4; color: white; cursor: pointer; font-weight: bold; margin-left: 10px;">
                Wyślij
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const loader = document.getElementById('loader');
        const promptInput = document.getElementById('prompt-input');

        // FUNKCJA: Przewijanie na sam dół strony
        function scrollToBottom() {
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        }

        // 1. Przewiń na dół natychmiast po załadowaniu strony (po otrzymaniu odpowiedzi)
        window.onload = function() {
            scrollToBottom();
            promptInput.focus(); // Opcjonalnie: ustaw kursor w polu tekstowym
        };

        // 2. Przewiń na dół po kliknięciu "Wyślij", żeby widzieć loader
        form.onsubmit = function() {
            loader.style.display = 'block';
            setTimeout(scrollToBottom, 50);
        };
    </script>

</body>
</html>
